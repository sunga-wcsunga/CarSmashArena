<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Smash Arena</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="menu">

        <h1>CAR SMASH ARENA</h1>

        <p class="tagline">
          "Bump your anger away!"
        </p>

        <div class="mode-card">

            <button id="classicButton">
              CLASSIC MODE
            </button>

            <p>
            How many can you smash down before time runs out?
            </p>

        </div>

        <div class="mode-card">

            <button id="survivalButton">
                SURVIVAL MODE
            </button>

            <p>
                How long can you survive?
            </p>

        </div>

    </div>

    <div id="pauseMenu" class="overlay">

        <h1>PAUSED</h1>

        <button id="resumeButton">
            RESUME
        </button>

        <button id="endGameButton">
            END GAME
        </button>

    </div>

    <div id="gameOverMenu" class="overlay">

        <h1>GAME OVER</h1>

        <p id="finalScoreText">
           Score: 0
        </p>

        <button id="playAgainButton">
           PLAY AGAIN
        </button>

        <button id="homeButton">
            BACK TO HOME
        </button>

    </div>

    <h1>Car Smash Arena</h1>

    <div id="hud">

        <div id="scoreText">
            Score: 0
        </div>

        <div id="timeText">
            Time: 60
        </div>

        <div id="healthText">
            Health: 100
        </div>

        <div id="comboText">
            Combo: 0
        </div>

    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <script src="js/controls.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/barriers.js"></script>
    <script src="js/collisions.js"></script>
    <script src="js/game.js"></script>

</body>

</html>
